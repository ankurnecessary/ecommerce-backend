name: "Setup Node + pnpm"
description: "Common setup for Node.js projects with pnpm"
runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
# [ ]: Try to use pnpe/action-setup@v4 https://github.com/pnpm/action-setup?tab=readme-ov-file#use-cache-to-reduce-installation-time
    - name: Install pnpm
      run: |
        npm install -g pnpm
        pnpm setup
        echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH
      shell: bash
      env:
        SHELL: /bin/bash

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
